<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Homepage (Dev) - Test Branch</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23007AFF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='10'/%3E%3Cpolygon points='16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76'/%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="https://324893.xyz/icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#e4d0e5">
    <meta name="apple-mobile-web-app-title" content="My Homepage">

    <!-- DNS Prefetch for external resources -->
    <link rel="dns-prefetch" href="//ossrsfyqbrzeauzksvpv.supabase.co">
    <link rel="dns-prefetch" href="//cdnjs.cloudflare.com">
    <link rel="dns-prefetch" href="//api.dicebear.com">
    <link rel="dns-prefetch" href="//manifest.im">
    <link rel="dns-prefetch" href="//favicon.vemetric.com">
    <link rel="dns-prefetch" href="//img.logo.dev">
    <link rel="dns-prefetch" href="//cdn.brandfetch.io">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/bookmark.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/controls.css">
    <link rel="stylesheet" href="css/user.css">
    <link rel="stylesheet" href="css/responsive.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="background-layer"></div>

    <div id="toast-container" class="toast-container"></div>
    <div id="sync-status" class="sync-status"></div>

    <div class="user-trigger-area">
        <div id="user-pill" class="user-pill" onclick="toggleAuthModal()">
            <div class="user-pill-icon">
                <svg id="user-icon-svg" viewBox="0 0 24 24" width="20" height="20" style="fill: white;">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
                <img id="user-avatar-img" src="" style="display: none;" alt="User Avatar">
            </div>
            <span id="user-pill-text" class="user-pill-text" data-i18n="btn_login">Login</span>
        </div>
    </div>

    <div class="container">
        <div id="bookmark-swiper" class="bookmark-swiper">
            <div id="bookmark-swiper-wrapper" class="bookmark-swiper-wrapper">
            </div>
        </div>
        <div id="pagination-dots" class="pagination-dots"></div>
    </div>

    <div id="edit-controls" class="edit-controls hidden">
        <button onclick="openModal()" data-i18n="btn_add_bookmark">➕ Add Bookmark</button>
        <button onclick="openPageEditModal()" data-i18n="btn_edit_page">📝 Edit Pages</button>
        <button onclick="importConfig()" data-i18n="btn_import">📥 Import</button>
        <button onclick="exportConfig()" data-i18n="btn_export">📤 Export</button>
        <button class="done-btn" onclick="toggleEditMode(false)" data-i18n="btn_done">Done</button>
    </div>

    <div id="theme-controls" class="edit-controls hidden" style="z-index: 1001;">
        <div class="theme-swatches">
            <div class="swatch" style="background: #e4d0e5" onclick="changeTheme('#e4d0e5', this, null)"></div>
            <div class="swatch" style="background: #f5dbe3" onclick="changeTheme('#f5dbe3', this, null)"></div>
            <div class="swatch" style="background: #f9e8ee" onclick="changeTheme('#f9e8ee', this, null)"></div>
            <div class="swatch" style="background: #dbe4f5" onclick="changeTheme('#dbe4f5', this, null)"></div>
            <div class="swatch" style="background: #f0f0f2" onclick="changeTheme('#f0f0f2', this, null)"></div>
            <div class="swatch" style="background: #1a1a1a; border: 1px solid #555;" onclick="changeTheme('#1a1a1a', this, null)"></div>
        </div>

        <div class="control-divider"></div>

        <div class="theme-patterns">
            <button class="pattern-btn" data-pattern="none" onclick="quickChangeTheme(null, 'none')" data-i18n="theme_default">Wave</button>
            <button class="pattern-btn" data-pattern="bg-pattern-aurora" onclick="quickChangeTheme(null, 'bg-pattern-aurora')" data-i18n="theme_aurora">Aurora</button>
            <button class="pattern-btn" data-pattern="bg-pattern-flow" onclick="quickChangeTheme(null, 'bg-pattern-flow')" data-i18n="theme_flow">Flow</button>
            <button class="pattern-btn" data-pattern="bg-pattern-lines-d" onclick="quickChangeTheme(null, 'bg-pattern-lines-d')" data-i18n="theme_lines_d">Lines</button>
        </div>

        <div class="control-divider"></div>

        <button class="done-btn" onclick="closeThemeControls()" data-i18n="btn_done">Done</button>
    </div>

    <div id="modal-placeholder"></div>
    <div id="page-edit-modal-placeholder"></div>
    <div id="pref-modal-placeholder"></div>
    <div id="auth-modal-placeholder"></div>
    <div id="user-dropdown-placeholder"></div>
    <div id="help-modal-placeholder"></div>
    <div id="confirm-modal-placeholder"></div>


    <input type="file" id="import-file-input" style="display: none;" accept=".json">

    <script type="module" src="js/main.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
