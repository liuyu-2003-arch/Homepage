<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; connect-src 'self' https://static.cloudflareinsights.com; object-src 'none'; base-uri 'none'; form-action 'self'">
    <title>My Homepage</title>
    <meta name="description" content="My Homepage 是一个可自定义的浏览器起始页：多页书签、拖拽整理、自动获取图标，支持跨设备云同步（可选登录）。 A customizable browser start page with multi-page bookmarks and optional cloud sync.">

    <!-- Open Graph -->
    <meta property="og:title" content="My Homepage">
    <meta property="og:description" content="可自定义的浏览器起始页：多页书签、拖拽整理、自动获取图标，支持跨设备云同步（可选登录）。">
    <meta property="og:image" content="https://324893.xyz/preview.jpg">
    <meta property="og:image:width" content="1440">
    <meta property="og:image:height" content="759">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://324893.xyz/">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" type="image/svg+xml" href="icon.svg?v=2.9.46">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2.9.46">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=2.9.46">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2.9.46">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#e4d0e5">
    <meta name="apple-mobile-web-app-title" content="My Homepage">
    <meta name="app-version" content="2.9.46">

    <!-- Static application metadata for crawlers and OAuth provider reviews -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "My Homepage",
        "url": "https://324893.xyz/",
        "description": "A customizable browser start page: multi-page bookmarks, drag-and-drop organization, automatic icon lookup and optional cross-device cloud sync.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "inLanguage": ["zh-CN", "en"],
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "privacyPolicy": "https://324893.xyz/privacy",
        "termsOfService": "https://324893.xyz/terms"
    }
    </script>

    <!-- Preconnect for external resources -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="dns-prefetch" href="//api.dicebear.com">
    <link rel="dns-prefetch" href="//manifest.im">
    <link rel="dns-prefetch" href="//favicon.vemetric.com">
    <link rel="dns-prefetch" href="//img.logo.dev">
    <link rel="dns-prefetch" href="//cdn.brandfetch.io">

    <link rel="stylesheet" href="css/base.css?v=2.9.46">
    <link rel="stylesheet" href="css/bookmark.css?v=2.9.46">
    <link rel="stylesheet" href="css/modal.css?v=2.9.46">
    <link rel="stylesheet" href="css/controls.css?v=2.9.46">
    <link rel="stylesheet" href="css/user.css?v=2.9.46">
    <link rel="stylesheet" href="css/responsive.css?v=2.9.46">

    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"
            integrity="sha384-BSxuMLxX+FCbTdYec3TbXlnMGEEM2QXTFdtDaveen71o+jswm2J36+xFqp8k4VHM"
            crossorigin="anonymous"></script>
</head>
<body>
    <div class="background-layer"></div>

    <!--
      Visible, server-rendered description. It must stay in the static HTML (not
      injected by JS) so search engines and OAuth provider reviewers can read the
      app name and purpose without signing in. visibility:visible deliberately
      overrides the boot-time body { visibility: hidden } rule below.
    -->
    <!--
      App description. The text stays in the static HTML (so crawlers and OAuth
      provider reviewers can read it) but is only shown when the visitor taps the
      round "!" button in the bottom-right corner.
    -->
    <div id="app-intro" class="app-intro" hidden>
        <button id="intro-dismiss" class="app-intro-dismiss" type="button" aria-label="Close">×</button>
        <h1 id="app-intro-title">My Homepage</h1>
        <p>
            可自定义的浏览器起始页：多页书签、拖拽整理、自动获取图标，登录后可跨设备云同步。<br>
            A customizable browser start page: multi-page bookmarks, drag-and-drop organisation, automatic favicon lookup and optional cross-device cloud sync.
        </p>
        <p class="app-intro-links">
            <a href="/privacy">隐私政策 / Privacy Policy</a>
            <span aria-hidden="true">·</span>
            <a href="/terms">服务条款 / Terms of Service</a>
        </p>
        <noscript>
            <p class="app-intro-noscript">未登录也可直接使用；JavaScript 被禁用时书签网格无法渲染。 / Works without an account; the grid needs JavaScript to render.</p>
        </noscript>
    </div>
    <button id="intro-toggle" class="intro-toggle" type="button"
            aria-label="关于本应用 / About this app" aria-controls="app-intro"
            title="关于本应用 / About this app">!</button>

    <div id="toast-container" class="toast-container" role="status" aria-live="polite" aria-atomic="false"></div>
    <div id="sync-status" class="sync-status" role="status" aria-live="polite"></div>
    <div id="bookmark-tooltip" class="bookmark-tooltip" role="tooltip" aria-hidden="true"></div>

    <div class="user-trigger-area">
        <div id="user-pill" class="user-pill" data-action="toggleAuthModal">
            <div class="user-pill-icon">
                <svg id="user-icon-svg" viewBox="0 0 24 24" width="20" height="20" style="fill: white;">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
                <img id="user-avatar-img" style="display: none;" alt="User Avatar">
            </div>
            <span id="user-pill-text" class="user-pill-text" data-i18n="btn_login">Login</span>
        </div>
    </div>

    <div class="container">
        <div id="bookmark-swiper" class="bookmark-swiper">
            <div id="bookmark-swiper-wrapper" class="bookmark-swiper-wrapper">
            </div>
        </div>
        <div id="pagination-dots" class="pagination-dots"></div>
    </div>

    <nav id="bookmark-dock" class="bookmark-dock hidden" aria-label="Bookmark dock">
        <section id="dock-common-group" class="dock-group">
            <div id="dock-common-items" class="dock-items"></div>
        </section>
        <div id="dock-divider" class="dock-divider" aria-hidden="true"></div>
        <section id="dock-recent-group" class="dock-group">
            <div id="dock-recent-items" class="dock-items"></div>
        </section>
    </nav>

    <div id="edit-controls" class="edit-controls hidden">
        <button data-action="openModal" data-i18n="btn_add_bookmark">➕ Add Bookmark</button>
        <button data-action="openPageEditModal" data-i18n="btn_edit_page">📝 Edit Pages</button>
        <button data-action="openDockEditModal" data-i18n="btn_edit_dock">Edit Dock</button>
        <button data-action="importConfig" data-i18n="btn_import">📥 Import</button>
        <button data-action="exportConfig" data-i18n="btn_export">📤 Export</button>
        <button class="done-btn" data-action="toggleEditMode" data-i18n="btn_done">Done</button>
    </div>

    <div id="theme-controls" class="edit-controls hidden" style="z-index: 1001;">
        <div class="theme-swatches">
            <div class="swatch" style="background: #e4d0e5" data-action="changeTheme" data-arg="#e4d0e5" data-self></div>
            <div class="swatch" style="background: #f5dbe3" data-action="changeTheme" data-arg="#f5dbe3" data-self></div>
            <div class="swatch" style="background: #f9e8ee" data-action="changeTheme" data-arg="#f9e8ee" data-self></div>
            <div class="swatch" style="background: #dbe4f5" data-action="changeTheme" data-arg="#dbe4f5" data-self></div>
            <div class="swatch" style="background: #f0f0f2" data-action="changeTheme" data-arg="#f0f0f2" data-self></div>
            <div class="swatch" style="background: #1a1a1a; border: 1px solid #555;" data-action="changeTheme" data-arg="#1a1a1a" data-self></div>
        </div>

        <div class="control-divider"></div>

        <div class="theme-patterns">
            <button class="pattern-btn" data-pattern="none" data-action="quickChangeTheme" data-arg="none" data-i18n="theme_default">Wave</button>
            <button class="pattern-btn" data-pattern="bg-pattern-aurora" data-action="quickChangeTheme" data-arg="bg-pattern-aurora" data-i18n="theme_aurora">Aurora</button>
            <button class="pattern-btn" data-pattern="bg-pattern-flow" data-action="quickChangeTheme" data-arg="bg-pattern-flow" data-i18n="theme_flow">Flow</button>
            <button class="pattern-btn" data-pattern="bg-pattern-lines-d" data-action="quickChangeTheme" data-arg="bg-pattern-lines-d" data-i18n="theme_lines_d">Lines</button>
        </div>

        <div class="control-divider"></div>

        <button class="done-btn" data-action="closeThemeControls" data-i18n="btn_done">Done</button>
    </div>

    <div id="modal-placeholder"></div>
    <div id="page-edit-modal-placeholder"></div>
    <div id="dock-edit-modal-placeholder"></div>
    <div id="auth-modal-placeholder"></div>
    <div id="user-dropdown-placeholder"></div>
    <div id="help-modal-placeholder"></div>
    <div id="confirm-modal-placeholder"></div>


    <input type="file" id="import-file-input" style="display: none;" accept=".json">

    <script type="module" src="js/main.js?v=2.9.46"></script>
</body>
</html>
