<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">My Homepage icon</title>
  <desc id="desc">A black monogram H with film-strip perforations on a luminous lime tile.</desc>
  <defs>
    <linearGradient id="tile" x1="72" y1="32" x2="440" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eeff8a"/>
      <stop offset=".31" stop-color="#d4ff38"/>
      <stop offset=".72" stop-color="#bdf600"/>
      <stop offset="1" stop-color="#a4db00"/>
    </linearGradient>
    <radialGradient id="tileSheen" cx="0" cy="0" r="1" gradientTransform="translate(162 105) rotate(46) scale(414 322)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".72"/>
      <stop offset=".42" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tileVignette" cx="0" cy="0" r="1" gradientTransform="translate(420 432) rotate(-138) scale(396 334)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#587500" stop-opacity=".26"/>
      <stop offset=".72" stop-color="#587500" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="92" y1="19" x2="421" y2="494" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".92"/>
      <stop offset=".25" stop-color="#f6ffcd" stop-opacity=".32"/>
      <stop offset=".58" stop-color="#d6ff29" stop-opacity=".18"/>
      <stop offset="1" stop-color="#5d7600" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="mark" x1="177" y1="98" x2="348" y2="415" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2a2e2b"/>
      <stop offset=".28" stop-color="#151816"/>
      <stop offset=".72" stop-color="#090b0a"/>
      <stop offset="1" stop-color="#020303"/>
    </linearGradient>
    <linearGradient id="markHighlight" x1="138" y1="109" x2="326" y2="224" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".38"/>
      <stop offset=".42" stop-color="#fff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="tileShadow" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse">
