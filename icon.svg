    <path id="hMark" fill-rule="evenodd" d="M148 102h36c31 0 42 17 42 47v77h60v-77c0-30 11-47 42-47h36c31 0 40 17 40 47v216c0 30-9 47-40 47h-36c-31 0-42-17-42-47v-77h-60v77c0 30-11 47-42 47h-36c-31 0-40-17-40-47V149c0-30 9-47 40-47Zm30 58a13 13 0 0 0-13 13v30a13 13 0 0 0 13 13h12a13 13 0 0 0 13-13v-30a13 13 0 0 0-13-13h-12Zm0 84a13 13 0 0 0-13 13v30a13 13 0 0 0 13 13h12a13 13 0 0 0 13-13v-30a13 13 0 0 0-13-13h-12Zm0 84a13 13 0 0 0-13 13v30a13 13 0 0 0 13 13h12a13 13 0 0 0 13-13v-30a13 13 0 0 0-13-13h-12Zm158-168a13 13 0 0 0-13 13v30a13 13 0 0 0 13 13h12a13 13 0 0 0 13-13v-30a13 13 0 0 0-13-13h-12Zm0 84a13 13 0 0 0-13 13v30a13 13 0 0 0 13 13h12a13 13 0 0 0 13-13v-30a13 13 0 0 0-13-13h-12Zm0 84a13 13 0 0 0-13 13v30a13 13 0 0 0 13 13h12a13 13 0 0 0 13-13v-30a13 13 0 0 0-13-13h-12ZM236 232l50 24-50 24v-48Z"/>
    <clipPath id="tileClip">
      <rect x="22" y="22" width="468" height="468" rx="112"/>
    </clipPath>
  </defs>

  <g filter="url(#tileShadow)">
    <rect x="22" y="22" width="468" height="468" rx="112" fill="url(#tile)"/>
    <g clip-path="url(#tileClip)">
      <rect x="22" y="22" width="468" height="468" fill="url(#tileSheen)"/>
      <rect x="22" y="22" width="468" height="468" fill="url(#tileVignette)"/>
      <path d="M46 278c108 82 285 127 438 68" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="2"/>
    </g>
    <rect x="28" y="28" width="456" height="456" rx="106" fill="none" stroke="url(#edge)" stroke-width="5"/>
    <rect x="34" y="34" width="444" height="444" rx="101" fill="none" stroke="#334300" stroke-opacity=".18" stroke-width="2"/>
  </g>

  <g filter="url(#markShadow)">
    <use href="#hMark" transform="translate(0 8)" fill="#203000" opacity=".22"/>
    <use href="#hMark" fill="url(#mark)"/>
    <use href="#hMark" fill="url(#markHighlight)" style="mix-blend-mode:screen"/>
  </g>

  <path d="M410 76l5 14 14 5-14 5-5 14-5-14-14-5 14-5 5-14Z" fill="#fff" fill-opacity=".78"/>
  <circle cx="435" cy="111" r="5" fill="#fff" fill-opacity=".34"/>
</svg>
