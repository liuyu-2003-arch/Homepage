<div class="modal-content profile-modal-content">
    <div class="modal-header">
        <h2>个人资料设置</h2>
        <span class="close-modal">&times;</span>
    </div>

    <div class="modal-body">
        <div class="profile-edit-container">

            <div class="profile-left-col">
                <div class="avatar-wrapper" title="点击更换头像">
                    <img id="pref-current-avatar" src="Logo/icon.png" alt="User Avatar" class="avatar-clickable">
                    <div class="avatar-overlay">
                        <span>更换</span>
                    </div>
                </div>
            </div>

            <div class="profile-right-col">

                <div class="form-group">
                    <label for="pref-nickname">昵称</label>
                    <input type="text" id="pref-nickname" placeholder="输入新的昵称" class="form-control">
                </div>

                <div class="form-group">
                    <label>邮箱</label>
                    <input type="text" id="pref-email" disabled class="form-control disabled-input">
                </div>

                <div id="avatar-upload-section" class="form-group" style="display: none;">
                    <label for="pref-avatar-file">上传新头像</label>
                    <input type="file" id="pref-avatar-file" accept="image/*" class="form-control">
                    <small class="form-text text-muted">支持 jpg, png, gif 格式</small>
                </div>

            </div>
        </div>
    </div>

    <div class="modal-footer">
        <button id="pref-save-btn" class="btn-primary">保存修改</button>
        <button class="btn-secondary close-modal-btn">取消</button>
    </div>
</div>

<script>
    (function() {
        const avatarImg = document.getElementById('pref-current-avatar');
        const uploadSection = document.getElementById('avatar-upload-section');

        if (avatarImg && uploadSection) {
            avatarImg.addEventListener('click', function() {
                // 切换显示状态
                if (uploadSection.style.display === 'none') {
                    uploadSection.style.display = 'block';
                    // 可选：自动触发文件选择框
                    // document.getElementById('pref-avatar-file').click();
                } else {
                    uploadSection.style.display = 'none';
                }
            });
        }
    })();
</script>
