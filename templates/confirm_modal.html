<div id="confirm-modal" class="modal hidden">
    <div class="modal-content" style="min-width: 300px; max-width: 350px;">
        <h3 id="confirm-title" data-i18n="confirm_delete_title">Confirm Delete</h3>
        <p id="confirm-message" style="text-align: center; color: #666; margin: 0;">Are you sure?</p>
        <div class="modal-actions">
            <button id="confirm-cancel" data-i18n="btn_cancel">Cancel</button>
            <button id="confirm-ok" class="primary" data-i18n="btn_delete">Delete</button>
        </div>
    </div>
</div>
