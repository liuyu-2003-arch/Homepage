<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-content bookmark-modal-content">
        <h3 data-i18n="modal_edit_title">Edit/Add Bookmark</h3>
        <div class="modal-top-split">
            <div class="preview-section">
                <div id="preview-card" class="bookmark-item">
                    <div class="icon-box">
                        <img id="preview-img" alt="Preview Image">
                        <div id="preview-text" class="text-icon hidden">A</div>
                    </div>
                    <div id="preview-title" class="bookmark-title" data-i18n="preview_title">Preview</div>
                </div>
            </div>
            <div class="candidate-section">
                <div id="icon-candidates" class="candidate-grid"></div>
                <div class="style-select-group">
                    <div class="style-option" data-style="full" data-action="selectStyle" data-self data-i18n="style_full">Full</div>
                    <div class="style-option" data-style="fit" data-action="selectStyle" data-self data-i18n="style_fit">Fit</div>
                    <div class="style-option" data-style="white" data-action="selectStyle" data-self data-i18n="style_white">White</div>
                </div>
            </div>
        </div>
        <div class="form-group">
            <div class="input-wrapper inline-field">
                <label for="input-url" style="font-size: 10px; color: #888; text-transform: uppercase; font-weight: 700;" data-i18n="label_url">URL</label>
                <div class="input-spacer"></div>
                <input type="text" id="input-url" placeholder="e.g. bilibili.com" data-action="autoFillInfo" data-input>
            </div>
            <div class="input-wrapper inline-field">
                <label for="input-title" style="font-size: 10px; color: #888; text-transform: uppercase; font-weight: 700;" data-i18n="label_title">Title</label>
                <div class="input-spacer"></div>
                <input type="text" id="input-title" placeholder="Title" data-action="updatePreview" data-input>
            </div>
            <div class="input-wrapper inline-field">
                <label for="input-note" style="font-size: 10px; color: #888; text-transform: uppercase; font-weight: 700;" data-i18n="label_note">Note</label>
                <div class="input-spacer"></div>
                <input type="text" id="input-note" maxlength="160" placeholder="Short note (optional)" autocomplete="off">
            </div>
            <div class="input-wrapper inline-field">
                <label for="input-icon" style="font-size: 10px; color: #888; text-transform: uppercase; font-weight: 700;" data-i18n="label_logo">Logo URL</label>
                <div class="input-spacer"></div>
                <input type="text" id="input-icon" placeholder="Icon URL (Optional)" data-action="updatePreview" data-input>
            </div>
            <div class="input-wrapper">
                <span style="font-size: 10px; color: #888; text-transform: uppercase; font-weight: 700;" data-i18n="label_page">Page</span>
                <div style="height: 8px;"></div>
                <div id="page-options-container" class="page-options-container"></div>
            </div>
        </div>
        <div class="modal-actions">
            <button data-action="closeModal" data-i18n="btn_cancel">Cancel</button>
            <button class="primary" data-action="saveBookmark" data-i18n="btn_confirm">Confirm</button>
        </div>
    </div>
</div>
