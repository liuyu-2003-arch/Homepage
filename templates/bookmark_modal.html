<div id="modal" class="modal hidden">
    <div class="modal-content">
        <h3 data-i18n="modal_edit_title">Edit/Add Bookmark</h3>
        <div class="modal-top-split">
            <div class="preview-section">
                <div id="preview-card" class="bookmark-item">
                    <div class="icon-box">
                        <img id="preview-img" src="" alt="Preview Image">
                        <div id="preview-text" class="text-icon hidden">A</div>
                    </div>
                    <div id="preview-title" class="bookmark-title" data-i18n="preview_title">Preview</div>
                </div>
            </div>
            <div class="candidate-section">
                <div id="icon-candidates" class="candidate-grid"></div>
                <div class="style-select-group">
                    <div class="style-option" data-style="full" onclick="selectStyle(this)" data-i18n="style_full">Full</div>
                    <div class="style-option" data-style="fit" onclick="selectStyle(this)" data-i18n="style_fit">Fit</div>
                    <div class="style-option" data-style="white" onclick="selectStyle(this)" data-i18n="style_white">White</div>
                </div>
            </div>
        </div>
        <div class="form-group">
            <div class="input-wrapper">
                <label for="input-url" style="font-size: 10px; color: #888; text-transform: uppercase; font-weight: 700;" data-i18n="label_url">URL</label>
                <div style="height: 8px;"></div>
                <input type="text" id="input-url" placeholder="e.g. bilibili.com" oninput="autoFillInfo()">
            </div>
            <div class="input-wrapper">
                <label for="input-title" style="font-size: 10px; color: #888; text-transform: uppercase; font-weight: 700;" data-i18n="label_title">Title</label>
                <div style="height: 8px;"></div>
                <input type="text" id="input-title" placeholder="Title" oninput="updatePreview()">
            </div>
            <div class="input-wrapper">
                <label for="input-icon" style="font-size: 10px; color: #888; text-transform: uppercase; font-weight: 700;" data-i18n="label_logo">Logo URL</label>
                <div style="height: 8px;"></div>
                <input type="text" id="input-icon" placeholder="Icon URL (Optional)" oninput="updatePreview()">
            </div>
            <div class="input-wrapper">
                <span style="font-size: 10px; color: #888; text-transform: uppercase; font-weight: 700;" data-i18n="label_page">Page</span>
                <div style="height: 8px;"></div>
                <div id="page-options-container" class="page-options-container"></div>
            </div>
        </div>
        <div class="modal-actions">
            <button onclick="closeModal()" data-i18n="btn_cancel">Cancel</button>
            <button class="primary" onclick="saveBookmark()" data-i18n="btn_confirm">Confirm</button>
        </div>
    </div>
</div>
