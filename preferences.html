<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
    <title>Account Preferences - My Homepage</title>
    <meta name="app-version" content="2.9.54">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23007AFF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='10'/%3E%3Cpolygon points='16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://api.dicebear.com">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e4d0e5 0%, #d4c4de 40%, #b8c4e0 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            color: #333;
            visibility: visible !important;
            overflow-y: auto;
        }
        .page {
            width: min(100%, 980px);
            margin: 0 auto;
            padding: 42px 24px 56px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }
        .header h1 {
            font-size: clamp(24px, 4vw, 30px);
            line-height: 1.15;
            font-weight: 750;
            letter-spacing: 0;
        }

        /* Card */
        .card {
            overflow: hidden;
            background: rgba(255,255,255,0.78);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 22px;
            box-shadow: 0 18px 50px rgba(0,0,0,0.1), 0 0 0 1px rgba(255,255,255,0.65);
        }
        .settings-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.04fr) minmax(0, 0.96fr);
            gap: 0;
        }
        .avatar-settings,
        .account-settings {
            min-width: 0;
            padding: 28px;
        }
        .avatar-settings {
            border-right: 1px solid rgba(0,0,0,0.08);
        }

        .profile-pill {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            min-width: 0;
            background: rgba(255,255,255,0.72);
            border: 1px solid rgba(0,0,0,0.06);
            border-radius: 16px;
            padding: 8px 12px 8px 8px;
            margin-bottom: 22px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.05);
        }
        .pill-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea, #764ba2);
            flex-shrink: 0;
            border: 2px solid rgba(255,255,255,0.9);
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
        }
        .pill-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .pill-name {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 15px;
            font-weight: 700;
            color: #333;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 4px;
            padding: 4px;
            margin-bottom: 14px;
            background: rgba(0,0,0,0.055);
            border-radius: 14px;
        }
        .tab {
            flex: 1;
            min-width: 0;
            padding: 9px 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            color: #666;
            background: transparent;
            transition: all 0.2s;
            user-select: none;
        }
        .tab:hover { color: #333; background: rgba(255,255,255,0.55); }
        .tab.active {
            color: #1f1f1f;
            background: #fff;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        /* Avatar grid */
        .grid-wrap {
            overflow-y: auto;
            max-height: 294px;
            border-radius: 16px;
            background: rgba(0,0,0,0.035);
            padding: 10px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
            gap: 8px;
        }
        .grid-item {
            aspect-ratio: 1;
            border-radius: 12px;
            cursor: pointer;
            overflow: hidden;
            border: 3px solid transparent;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            background: #e8e8e8;
        }
        .grid-item:hover {
            transform: translateY(-2px) scale(1.03);
            border-color: rgba(0,122,255,0.45);
        }
        .grid-item.selected {
            border-color: #007AFF;
            box-shadow: 0 3px 12px rgba(0,122,255,0.28);
        }
        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* URL panel */
        .url-panel { display: none; }
        .url-panel.active { display: block; }
        .url-panel p {
            font-size: 13px;
            color: #666;
            margin-bottom: 12px;
            text-align: center;
        }

        /* Form */
        .account-settings {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 22px;
        }
        .field label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #555;
            margin-bottom: 9px;
        }
        .field input,
        .phone-row select {
            width: 100%;
            min-height: 46px;
            padding: 11px 13px;
            border-radius: 13px;
            border: 1px solid #dedede;
            background: rgba(255,255,255,0.84);
            color: #333;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }
        .field input:focus,
        .phone-row select:focus {
            border-color: #007AFF;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(0,122,255,0.14);
        }
        .phone-row {
            display: flex;
            gap: 9px;
        }
        .phone-row select {
            width: 124px;
            flex: 0 0 124px;
            cursor: pointer;
        }
        .phone-row input { flex: 1; min-width: 0; }

        /* Actions */
        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 18px 28px;
            border-top: 1px solid rgba(0,0,0,0.08);
            background: rgba(255,255,255,0.34);
        }
        .actions {
            display: flex;
            gap: 10px;
            margin-left: auto;
        }
        .actions button,
        .btn-logout {
            min-height: 44px;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .actions button:active,
        .btn-logout:active { transform: scale(0.97); }
        .btn-cancel {
            border: 1px solid rgba(0,0,0,0.08);
            background: rgba(0,0,0,0.055);
            color: #555;
        }
        .btn-cancel:hover { background: rgba(0,0,0,0.09); }
        .btn-save {
            border: none;
            background: #007AFF;
            color: #fff;
            box-shadow: 0 5px 16px rgba(0,122,255,0.25);
        }
        .btn-save:hover {
            background: #006ee6;
            box-shadow: 0 7px 20px rgba(0,122,255,0.3);
        }
        .btn-save:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .logout-actions { margin: 0; }
        .btn-logout {
            border: 1px solid rgba(198,40,40,0.25);
            background: rgba(198,40,40,0.06);
            color: #c62828;
        }
        .btn-logout:hover {
            background: rgba(198,40,40,0.12);
            border-color: rgba(198,40,40,0.4);
        }
        .btn-logout:disabled {
            opacity: 0.5;
            cursor: wait;
            transform: none;
        }

        @media (max-width: 760px) {
            .page { padding: 26px 16px 36px; }
            .header { margin-bottom: 14px; }
            .header h1 { font-size: 24px; }
            .settings-grid { grid-template-columns: 1fr; }
            .avatar-settings,
            .account-settings { padding: 22px 20px; }
            .avatar-settings {
                border-right: 0;
                border-bottom: 1px solid rgba(0,0,0,0.08);
            }
            .account-settings { gap: 18px; }
            .grid-wrap { max-height: 250px; }
            .card-footer {
                flex-direction: column-reverse;
                align-items: stretch;
                padding: 16px 20px 20px;
            }
            .actions {
                width: 100%;
                margin-left: 0;
            }
            .actions button { flex: 1; }
            .logout-actions,
            .btn-logout { width: 100%; }
        }
        @media (max-width: 420px) {
            .page { padding-inline: 12px; }
            .avatar-settings,
            .account-settings { padding: 20px 16px; }
            .phone-row { flex-direction: column; }
            .phone-row select { width: 100%; flex-basis: auto; }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="header">
            <h1 data-i18n="modal_pref_title">Account Preferences</h1>
        </div>

        <div class="card">
            <div class="settings-grid">
                <section class="avatar-settings">
                    <div class="profile-pill">
                        <div class="pill-avatar">
                            <img id="pref-current-img" alt="">
                        </div>
                        <span id="pref-preview-name" class="pill-name">Display Name</span>
                    </div>

                    <div class="tabs" role="tablist">
                        <button class="tab active" type="button" role="tab" aria-selected="true" data-tab="emoji" data-action="switchAvatarTab" data-arg="emoji" data-i18n="tab_emoji">Icons</button>
                        <button class="tab" type="button" role="tab" aria-selected="false" data-tab="upload" data-action="switchAvatarTab" data-arg="upload" data-i18n="tab_url">URL</button>
                    </div>

                    <div id="panel-emoji" class="grid-wrap">
                        <div id="pref-avatar-grid" class="grid"></div>
                    </div>

                    <div id="panel-upload" class="url-panel">
                        <p data-i18n="msg_input_url">Paste Image URL</p>
                        <div class="field">
                            <input type="text" id="avatar-url-input" placeholder="https://example.com/avatar.png" data-action="handleAvatarUrlInput" data-input>
                        </div>
                    </div>
                </section>

                <section class="account-settings">
                    <div class="field">
                        <label for="pref-name" data-i18n="label_display_name">Display Name</label>
                        <input type="text" id="pref-name" placeholder="Display Name" data-action="updatePrefNamePreview" data-input>
                    </div>

                    <div class="field">
                        <label data-i18n="label_phone">Phone</label>
                        <div class="phone-row">
                            <select id="pref-phone-code">
                                <option value="+86">🇨🇳 +86</option>
                                <option value="+1">🇺🇸 +1</option>
                                <option value="+852">🇭🇰 +852</option>
                                <option value="+886">🇹🇼 +886</option>
                                <option value="+81">🇯🇵 +81</option>
                                <option value="+82">🇰🇷 +82</option>
                                <option value="+44">🇬🇧 +44</option>
                                <option value="+33">🇫🇷 +33</option>
                                <option value="+49">🇩🇪 +49</option>
                                <option value="+7">🇷🇺 +7</option>
                                <option value="+61">🇦🇺 +61</option>
                            </select>
                            <input type="tel" id="pref-phone-number" placeholder="Number"
                                   data-filter="digits">
                        </div>
                    </div>
                </section>
            </div>

            <div class="card-footer">
                <div class="logout-actions">
                    <button class="btn-logout" id="btn-logout" data-action="logoutPreferences" data-i18n="menu_logout">Log out</button>
                </div>
                <div class="actions">
                    <button class="btn-cancel" data-action="navigate" data-arg="index.html" data-i18n="btn_cancel">Cancel</button>
                    <button class="btn-save" id="btn-save" data-action="savePreferences" data-i18n="btn_save">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/preferences.js?v=2.9.54"></script>
</body>
</html>
