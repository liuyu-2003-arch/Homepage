<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Preferences - My Homepage</title>
    <meta name="app-version" content="2.7.0">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23007AFF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='10'/%3E%3Cpolygon points='16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://ossrsfyqbrzeauzksvpv.supabase.co">
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/modal.css">
    <script defer src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"
            integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o"
            crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(135deg, #e4d0e5 0%, #c9b8d4 50%, #a8b5d4 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
        }
        .pref-page-wrapper {
            width: 100%;
            max-width: 520px;
            padding: 20px 20px 40px;
            box-sizing: border-box;
        }
        .pref-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
        }
        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.5);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #555;
            transition: background 0.2s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.7); }
        .pref-title {
            font-size: 22px;
            font-weight: 700;
            color: #333;
        }
        .pref-card {
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 28px 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.08);
            border: 1px solid rgba(255,255,255,0.5);
            display: flex;
            flex-direction: column;
            gap: 22px;
        }
        .pref-preview-container {
            display: flex;
            justify-content: center;
        }
        .pref-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.6);
            border-radius: 30px;
            padding: 6px 20px 6px 6px;
            border: 1px solid rgba(255,255,255,0.6);
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .pref-pill-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            background: rgba(0,0,0,0.3);
            flex-shrink: 0;
        }
        .pref-pill-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .pref-pill-text {
            font-size: 16px;
            font-weight: 600;
            color: #444;
            white-space: nowrap;
        }
        .avatar-tabs {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .avatar-tab-item {
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: #666;
            background: rgba(0,0,0,0.04);
            transition: all 0.2s;
        }
        .avatar-tab-item.active {
            background: #007AFF;
            color: white;
        }
        .avatar-panel { min-height: 180px; }
        .avatar-panel.hidden { display: none; }
        .avatar-grid-scroll {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            max-height: 240px;
            overflow-y: auto;
            padding: 8px;
        }
        .avatar-option {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            cursor: pointer;
            overflow: hidden;
            border: 3px solid transparent;
            transition: border-color 0.2s, transform 0.15s;
            background: #f0f0f0;
        }
        .avatar-option:hover { transform: scale(1.08); }
        .avatar-option.selected { border-color: #007AFF; }
        .avatar-option img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .form-label {
            display: block;
            font-size: 11px;
            color: #767676;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .form-input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
            background: #f9f9f9;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }
        .form-input:focus { border-color: #007AFF; }
        .phone-row {
            display: flex;
            gap: 10px;
        }
        .phone-code {
            width: 110px;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
            background: #f9f9f9;
            padding: 12px 8px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }
        .phone-number {
            flex: 1;
            min-width: 0;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
            background: #f9f9f9;
            font-size: 14px;
            outline: none;
        }
        .phone-number:focus, .phone-code:focus { border-color: #007AFF; }
        .pref-actions {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }
        .pref-actions button {
            flex: 1;
            padding: 13px;
            border-radius: 14px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s;
        }
        .pref-actions button:active { transform: scale(0.97); }
        .btn-back {
            background: rgba(0,0,0,0.06);
            color: #555;
        }
        .btn-save {
            background: #007AFF;
            color: white;
        }
        .btn-save:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        @media (max-width: 480px) {
            .pref-page-wrapper { padding: 16px 16px 32px; }
            .pref-card { padding: 22px 18px; }
        }
    </style>
</head>
<body>
    <div class="pref-page-wrapper">
        <div class="pref-header">
            <button class="back-btn" onclick="location.href='index.html'" aria-label="Back">←</button>
            <h1 class="pref-title" data-i18n="modal_pref_title">Account Preferences</h1>
        </div>

        <div class="pref-card">
            <!-- Preview -->
            <div class="pref-preview-container">
                <div class="pref-pill">
                    <div class="pref-pill-icon">
                        <img id="pref-current-img" alt="Current Avatar">
                    </div>
                    <span id="pref-preview-name" class="pref-pill-text">Display Name</span>
                </div>
            </div>

            <!-- Avatar tabs -->
            <div class="avatar-tabs">
                <div class="avatar-tab-item active" data-tab="emoji" onclick="switchAvatarTab('emoji')" data-i18n="tab_emoji">Icons</div>
                <div class="avatar-tab-item" data-tab="upload" onclick="switchAvatarTab('upload')" data-i18n="tab_url">URL</div>
            </div>

            <!-- Avatar grid -->
            <div id="avatar-panel-emoji" class="avatar-panel">
                <div id="pref-avatar-grid" class="avatar-grid-scroll"></div>
            </div>

            <!-- URL input -->
            <div id="avatar-panel-upload" class="avatar-panel hidden">
                <p style="font-size: 13px; color: #666; margin: 0 0 12px; text-align: center;" data-i18n="msg_input_url">Paste Image URL</p>
                <input type="text"
                       id="avatar-url-input"
                       class="form-input"
                       placeholder="https://example.com/avatar.png"
                       oninput="handleAvatarUrlInput(this.value)">
            </div>

            <!-- Display Name -->
            <div>
                <label class="form-label" for="pref-name" data-i18n="label_display_name">Display Name</label>
                <input type="text" id="pref-name" class="form-input" placeholder="Display Name" oninput="updatePrefNamePreview(this.value)">
            </div>

            <!-- Phone -->
            <div>
                <label class="form-label" data-i18n="label_phone">Phone</label>
                <div class="phone-row">
                    <select id="pref-phone-code" class="phone-code">
                        <option value="+86">🇨🇳 +86</option>
                        <option value="+1">🇺🇸 +1</option>
                        <option value="+852">🇭🇰 +852</option>
                        <option value="+886">🇹🇼 +886</option>
                        <option value="+81">🇯🇵 +81</option>
                        <option value="+82">🇰🇷 +82</option>
                        <option value="+44">🇬🇧 +44</option>
                        <option value="+33">🇫🇷 +33</option>
                        <option value="+49">🇩🇪 +49</option>
                        <option value="+7">🇷🇺 +7</option>
                        <option value="+61">🇦🇺 +61</option>
                    </select>
                    <input type="tel"
                           id="pref-phone-number"
                           class="phone-number"
                           placeholder="Number"
                           oninput="this.value = this.value.replace(/\D/g, '')">
                </div>
            </div>

            <!-- Actions -->
            <div class="pref-actions">
                <button class="btn-back" onclick="location.href='index.html'" data-i18n="btn_cancel">Cancel</button>
                <button class="btn-save" id="btn-save" onclick="savePreferences()" data-i18n="btn_save">Save Changes</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/preferences.js"></script>
</body>
</html>
