<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'">
    <title>Account Preferences - My Homepage</title>
    <meta name="app-version" content="2.9.24">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23007AFF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='10'/%3E%3Cpolygon points='16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://api.dicebear.com">
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <script defer src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"
            integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o"
            crossorigin="anonymous"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e4d0e5 0%, #d4c4de 40%, #b8c4e0 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            color: #333;
            visibility: visible !important;
            overflow-y: auto;
        }
        .page {
            max-width: 800px;
            margin: 0 auto;
            padding: 24px 20px 48px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 20px;
        }
        .header h1 { font-size: 22px; font-weight: 700; }

        /* Card */
        .card {
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 22px;
            padding: 24px 28px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.08), 0 0 0 1px rgba(255,255,255,0.5);
            display: flex; flex-direction: column; gap: 18px;
        }

        .pill {
            display: flex; align-items: center; gap: 12px;
            background: rgba(255,255,255,0.7);
            border-radius: 40px; padding: 5px 16px 5px 5px;
            border: 1px solid rgba(255,255,255,0.7);
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }
        .pill-avatar {
            width: 36px; height: 36px;
            border-radius: 50%; overflow: hidden;
            background: linear-gradient(135deg, #667eea, #764ba2);
            flex-shrink: 0;
        }
        .pill-avatar img {
            width: 100%; height: 100%; object-fit: cover; display: block;
        }
        .pill-name {
            font-size: 15px; font-weight: 600; color: #333;
        }

        /* Tabs */
        .tabs {
            display: flex; gap: 10px;
        }
        .tab {
            padding: 10px 22px; border-radius: 24px;
            cursor: pointer; font-size: 13px; font-weight: 600;
            color: #666; background: rgba(0,0,0,0.05);
            transition: all 0.2s; border: none;
            user-select: none;
        }
        .tab.active {
            background: #007AFF; color: #fff;
            box-shadow: 0 4px 12px rgba(0,122,255,0.3);
        }

        /* Avatar grid */
        .grid-wrap {
            overflow-y: auto;
            max-height: 180px;
            border-radius: 16px;
            background: rgba(0,0,0,0.03);
            padding: 12px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
            gap: 8px;
        }
        .grid-item {
            aspect-ratio: 1;
            border-radius: 12px;
            cursor: pointer;
            overflow: hidden;
            border: 3px solid transparent;
            transition: all 0.2s;
            background: #e8e8e8;
        }
        .grid-item:hover { transform: scale(1.1); border-color: rgba(0,122,255,0.4); }
        .grid-item.selected { border-color: #007AFF; box-shadow: 0 2px 10px rgba(0,122,255,0.3); }
        .grid-item img {
            width: 100%; height: 100%; object-fit: cover; display: block;
        }

        /* URL panel */
        .url-panel { display: none; }
        .url-panel.active { display: block; }
        .url-panel p {
            font-size: 13px; color: #666; margin-bottom: 12px; text-align: center;
        }

        /* Form */
        .field label {
            display: block; font-size: 11px; font-weight: 700;
            color: #767676; text-transform: uppercase; letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        .field input {
            width: 100%; padding: 11px 14px;
            border-radius: 14px; border: 1.5px solid #e0e0e0;
            background: rgba(255,255,255,0.8);
            font-size: 15px; outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .field input:focus {
            border-color: #007AFF;
            box-shadow: 0 0 0 3px rgba(0,122,255,0.15);
        }
        .phone-row {
            display: flex; gap: 10px;
        }
        .phone-row select {
            width: 120px; padding: 13px 10px;
            border-radius: 14px; border: 1.5px solid #e0e0e0;
            background: rgba(255,255,255,0.8);
            font-size: 15px; outline: none; cursor: pointer;
            transition: border-color 0.2s;
        }
        .phone-row select:focus { border-color: #007AFF; }
        .phone-row input { flex: 1; min-width: 0; }

        /* Actions */
        .actions {
            display: flex; gap: 12px; margin-top: 4px;
        }
        .actions button {
            flex: 1; padding: 13px;
            border-radius: 16px; border: none;
            font-size: 16px; font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .actions button:active { transform: scale(0.96); }
        .btn-cancel {
            background: rgba(0,0,0,0.06); color: #555;
        }
        .btn-cancel:hover { background: rgba(0,0,0,0.1); }
        .btn-save {
            background: #007AFF; color: #fff;
            box-shadow: 0 4px 16px rgba(0,122,255,0.3);
        }
        .btn-save:hover { background: #0066d6; }
        .btn-save:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        @media (max-width: 480px) {
            .page { padding: 16px 14px 36px; }
            .card { padding: 24px 20px; gap: 20px; }
            .header h1 { font-size: 19px; }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="header">
            <h1 data-i18n="modal_pref_title">Account Preferences</h1>
            <div class="pill">
                <div class="pill-avatar">
                    <img id="pref-current-img" alt="">
                </div>
                <span id="pref-preview-name" class="pill-name">Display Name</span>
            </div>
        </div>

        <div class="card">


            <div class="tabs">
                <button class="tab active" data-tab="emoji" data-action="switchAvatarTab" data-arg="emoji" data-i18n="tab_emoji">Icons</button>
                <button class="tab" data-tab="upload" data-action="switchAvatarTab" data-arg="upload" data-i18n="tab_url">URL</button>
            </div>

            <div id="panel-emoji" class="grid-wrap">
                <div id="pref-avatar-grid" class="grid"></div>
            </div>

            <div id="panel-upload" class="url-panel">
                <p data-i18n="msg_input_url">Paste Image URL</p>
                <div class="field">
                    <input type="text" id="avatar-url-input" placeholder="https://example.com/avatar.png" data-action="handleAvatarUrlInput" data-input>
                </div>
            </div>

            <div class="field">
                <label for="pref-name" data-i18n="label_display_name">Display Name</label>
                <input type="text" id="pref-name" placeholder="Display Name" data-action="updatePrefNamePreview" data-input>
            </div>

            <div class="field">
                <label data-i18n="label_phone">Phone</label>
                <div class="phone-row">
                    <select id="pref-phone-code">
                        <option value="+86">🇨🇳 +86</option>
                        <option value="+1">🇺🇸 +1</option>
                        <option value="+852">🇭🇰 +852</option>
                        <option value="+886">🇹🇼 +886</option>
                        <option value="+81">🇯🇵 +81</option>
                        <option value="+82">🇰🇷 +82</option>
                        <option value="+44">🇬🇧 +44</option>
                        <option value="+33">🇫🇷 +33</option>
                        <option value="+49">🇩🇪 +49</option>
                        <option value="+7">🇷🇺 +7</option>
                        <option value="+61">🇦🇺 +61</option>
                    </select>
                    <input type="tel" id="pref-phone-number" placeholder="Number"
                           data-filter="digits">
                </div>
            </div>

            <div class="actions">
                <button class="btn-cancel" data-action="navigate" data-arg="index.html" data-i18n="btn_cancel">Cancel</button>
                <button class="btn-save" id="btn-save" data-action="savePreferences" data-i18n="btn_save">Save Changes</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/preferences.js?v=2.9.24"></script>
</body>
</html>
